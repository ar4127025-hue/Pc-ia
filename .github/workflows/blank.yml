#!/bin/bash
# ==============================================================================
# RTX 3060 VM Bootstrap Script
# Gera um repositório GitHub completo para uma VM com GPU Passthrough
# ==============================================================================

set -e

# Configurações do Projeto
PROJECT_NAME="rtx3060-virtual-lab"
HOST_IP="192.168.56.100"
GPU_VENDOR="nvidia"
GPU_MODEL="RTX 3060"
STORAGE_GB=256
CPU_CORES=8
RAM_MB=16384

# Cores para output
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
BLUE='\033[0;34m'
NC='\033[0m' # No Color

log() {
    echo -e "${BLUE}[$(date +'%H:%M:%S')]${NC} $1"
}

success() {
    echo -e "${GREEN}[OK]${NC} $1"
}

warn() {
    echo -e "${YELLOW}[WARN]${NC} $1"
}

# Limpar diretório anterior se existir
if [ -d "$PROJECT_NAME" ]; then
    warn "Diretório '$PROJECT_NAME' já existe. Removendo..."
    rm -rf "$PROJECT_NAME"
fi

mkdir -p "$PROJECT_NAME"
cd "$PROJECT_NAME"

log "Criando estrutura de diretórios..."
mkdir -p {ansible/{playbooks,group_vars,roles/{gpu,storage,network}/tasks,templates},scripts,config,.github/workflows,docs}

# ==============================================================================
# 1. README.md
# ==============================================================================
log "Gerando README.md..."
cat > README.md <<'EOF'
# 🖥️ RTX 3060 Virtual Lab

Um laboratório de VM completo com **NVIDIA RTX 3060** e **256GB de armazenamento NVMe**, pronto para uso em GitHub. Este projeto utiliza Vagrant + Libvirt + Ansible para orquestrar a criação de uma máquina virtual de alta performance para computação científica, renderização ou ML.

## 📊 Especificações

| Componente | Especificação | Detalhes |
|------------|---------------|----------|
| **CPU** | 8 vCPUs | x86_64 (KVM) |
| **RAM** | 16 GB | DDR4 |
| **GPU** | NVIDIA RTX 3060 | 12GB GDDR6 (Passthrough) |
| **Armazenamento** | 256 GB | NVMe (RAID 0 opcional) |
| **Sistema Operacional** | Ubuntu 22.04 LTS | Server Edition |
| **Hipervisor** | QEMU/KVM | Libvirt |
| **Virtualização** | VT-x / AMD-V | IOMMU habilitado |

## 🏗️ Arquitetura
